<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь в Формулу 1 — игра-квест</title>
<meta name="description" content="Игра по Формуле 1: 10 уровней, 100 вопросов, настоящие истории о гонщиках и магазин карточек.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --surface:#FFFFFF; --ink:#141B23; --muted:#56626F; --line:#C5CED8;
  --board:#10161D; --board-ink:#FFD21F;
  --purple:#6A2FD1; --purple-tint:#EFE8FC;
  --red:#C62B34; --red-tint:#FBE9EA;
  --gold:#A87C00; --gold-tint:#FFF4CC;
  --steel:#4E5F72; --steel-tint:#E6ECF2;
  --focus:#0B63CE;
  --head:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"PT Serif",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --surface:#18212B; --ink:#EAF0F5; --muted:#9AA7B4; --line:#2A3846;
    --purple:#B18CFF; --purple-tint:#2A2142; --red:#FF6B73; --red-tint:#3A1F23;
    --gold:#F2C744; --gold-tint:#3A3116; --steel:#9DB0C4; --steel-tint:#202C38;
    --focus:#7DB6FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#EAF0F5; --muted:#9AA7B4; --line:#2A3846;
  --purple:#B18CFF; --purple-tint:#2A2142; --red:#FF6B73; --red-tint:#3A1F23;
  --gold:#F2C744; --gold-tint:#3A3116; --steel:#9DB0C4; --steel-tint:#202C38;
  --focus:#7DB6FF; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:1.05rem; line-height:1.6; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10}
button{font:inherit}
.site-in{max-width:720px; margin:0 auto; padding:0 18px}
.wrap{max-width:640px; margin:0 auto; padding:0 18px 48px}

/* Site shell */
.site-head{padding:14px 0; border-bottom:1.5px solid var(--line)}
.site-head .site-in{display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{font-family:var(--head); font-weight:800; font-size:1.4rem; color:var(--ink); text-decoration:none}
.site-head nav a{font-family:var(--head); font-weight:600; font-size:1.15rem; color:var(--ink); text-decoration:none; padding:6px 0; border-bottom:2px solid transparent}
.site-head nav a:hover{border-bottom-color:var(--purple)}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.hero{background:var(--board); color:#fff; padding:40px 0 44px}
.hero h1{margin:0; font-family:var(--head); font-weight:800; font-size:clamp(2.8rem,13vw,4.6rem); line-height:1; color:var(--board-ink)}
.hero .lead{margin:16px 0 22px; font-size:1.12rem; max-width:34em}
.hero .btn{background:var(--board-ink); color:var(--board); text-decoration:none}
.hero .btn:focus-visible{outline-color:#fff}
#game{scroll-margin-top:-90px; padding-top:18px}
.site-foot{padding:26px 0 36px; color:var(--muted); font-size:.95rem}
.site-foot p{margin:0}

/* HUD */
.hud{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:10px 0 10px; border-bottom:1.5px solid var(--line)}
.hud-row{display:flex; align-items:center; justify-content:space-between; gap:12px; font-family:var(--head); font-weight:600; font-size:1.15rem; line-height:1.2}
.hud-row b{font-weight:800}
.hud-right{display:flex; align-items:center; gap:14px}
.passes{display:flex; gap:5px}
.pass{width:13px; height:18px; border:2px solid var(--ink); border-radius:3px; background:var(--board-ink)}
.pass.off{background:transparent; opacity:.3}
.sectors{display:flex; gap:4px; margin-top:8px}
.sectors i{flex:1; height:6px; border-radius:2px; background:var(--line)}
.sectors i.ok{background:var(--purple)}
.sectors i.bad{background:var(--red)}
.sectors i.now{background:var(--board-ink); outline:1.5px solid var(--ink)}
.coin{display:inline-flex; align-items:center; gap:5px; font-family:var(--head); font-weight:800; font-size:1.2rem; line-height:1; white-space:nowrap}
.lap-ic{width:1.15em; height:1.15em; flex:none}

/* Boards & text */
.board{background:var(--board); color:var(--board-ink); border-radius:6px; padding:18px 18px 16px; margin:18px 0}
.board .q{margin:0; font-family:var(--head); font-weight:700; font-size:1.5rem; line-height:1.2}
.board.hero2 h1,.board.hero2 h2{margin:0; font-family:var(--head); font-weight:800; font-size:clamp(2rem,9vw,2.9rem); line-height:1.05}
.board .sub{margin:8px 0 0; font-family:var(--head); font-weight:600; font-size:1.25rem; color:#fff}
h2.place{font-family:var(--head); font-weight:800; font-size:1.8rem; line-height:1.1; margin:20px 0 6px}
.scene{margin:0; color:var(--muted); font-style:italic}
.rules{padding-left:1.2em; margin:14px 0 18px}
.rules li{margin:6px 0}

/* Buttons */
.btn{display:inline-block; font-family:var(--head); font-weight:800; font-size:1.25rem; background:var(--board); color:var(--board-ink); border:0; border-radius:8px; padding:12px 24px; min-height:48px; cursor:pointer; margin:6px 8px 0 0; text-align:center}
.btn.alt{background:transparent; color:var(--ink); border:2px solid var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
.back{background:none; border:0; color:var(--ink); font-family:var(--head); font-weight:700; font-size:1.15rem; padding:8px 0; cursor:pointer}
.linkish{background:none; border:0; color:var(--muted); text-decoration:underline; padding:8px 0; cursor:pointer; font-size:.95rem}
.opt{display:block; width:100%; text-align:left; min-height:48px; font:700 1.05rem/1.3 var(--body); color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:13px 16px; margin:0 0 10px; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default; color:var(--ink)}
.opt.ok{background:var(--purple-tint); border-color:var(--purple)}
.opt.right{border:2px dashed var(--purple)}
.opt.bad{background:var(--red-tint); border-color:var(--red); text-decoration:line-through; text-decoration-thickness:1.5px}
.opt.dim{opacity:.5}
.opt.gone{opacity:.3; text-decoration:line-through; border-style:dashed}
.hintbtn{font-size:1.05rem; padding:10px 16px; margin:2px 0 6px; width:100%}
.hintcount{font-family:var(--head); font-weight:800}

/* Menu tiles */
.tiles{display:grid; gap:12px; margin:18px 0}
.tile{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; min-height:64px}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile:disabled{cursor:default; opacity:.55}
.tile .num{flex:none; width:44px; height:44px; border-radius:8px; background:var(--board); color:var(--board-ink); display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:800; font-size:1.5rem}
.tile.done .num{background:var(--purple); color:#fff}
.tile .tt{font-family:var(--head); font-weight:800; font-size:1.35rem; line-height:1.15; display:block}
.tile .ts{font-size:.95rem; color:var(--muted); display:block; line-height:1.35}

/* Feedback */
.fact{border-left:5px solid var(--purple); background:var(--surface); padding:14px 16px 16px; border-radius:0 8px 8px 0; margin:16px 0}
.fact.wrong{border-left-color:var(--red)}
.fact h3{font-family:var(--head); font-weight:800; font-size:1.45rem; line-height:1.15; margin:0 0 6px; color:var(--purple)}
.fact.wrong h3{color:var(--red)}
.fact p{margin:0}
.reward{background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:12px 16px; margin:16px 0}
.reward .line{display:flex; justify-content:space-between; gap:12px; padding:4px 0}
.reward .total{border-top:1.5px solid var(--line); margin-top:6px; padding-top:8px; font-weight:700}

/* Niko */
.niko{display:flex; align-items:flex-end; gap:10px; margin:16px 0 4px}
.niko .fig{flex:none; width:78px; display:block}
.niko .fig svg{width:100%; height:auto; display:block}
.bubble{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:9px 14px 10px; font-size:.98rem; line-height:1.45; margin-bottom:22px}
.bubble::before{content:""; position:absolute; left:-8px; bottom:14px; width:14px; height:14px; background:var(--surface); border-left:1.5px solid var(--line); border-bottom:1.5px solid var(--line); transform:rotate(45deg)}
.bubble b{display:block; font-family:var(--head); font-weight:800; font-size:1.05rem; color:var(--purple); line-height:1.2}

/* Cards */
.cards{display:grid; gap:14px; margin:16px 0 20px}
@media (min-width:560px){.cards{grid-template-columns:1fr 1fr}}
.card{--rc:var(--steel); --rt:var(--steel-tint); background:var(--surface); border:2px solid var(--rc); border-radius:12px; overflow:hidden; display:flex; flex-direction:column}
.card.rare{--rc:var(--purple); --rt:var(--purple-tint)}
.card.legend{--rc:var(--gold); --rt:var(--gold-tint)}
.card .strip{display:flex; justify-content:space-between; align-items:center; background:var(--rt); color:var(--rc); padding:6px 12px; font-family:var(--head); font-weight:800; font-size:1rem}
.card .strip .fl{font-size:1.25rem; line-height:1}
.card .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1}
.card .top{display:flex; align-items:center; gap:12px}
.mono{flex:none; width:58px; height:58px; border-radius:50%; background:var(--board); color:var(--board-ink); display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:800; font-size:1.55rem; border:3px solid var(--rc)}
.mono.num{background:#fff; color:#141B23; border:4px solid var(--rc); box-shadow:inset 0 0 0 2px #141B23; font-size:1.9rem; letter-spacing:-.02em}
.mono.num.two{font-size:1.6rem}
.card.locked .mono.num{background:#fff; color:#141B23; opacity:.75}
.card.locked .mono{background:var(--line); color:var(--muted)}
.card h3{margin:0; font-family:var(--head); font-weight:800; font-size:1.35rem; line-height:1.1}
.card dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:.95rem}
.card dt{color:var(--muted)}
.card dd{margin:0; font-weight:700}
.card .cf{margin:0; font-size:.95rem; line-height:1.45}
.card .note{margin:0; color:var(--muted); font-size:.95rem; font-style:italic}
.card .btn{margin:auto 0 0; width:100%; display:flex; align-items:center; justify-content:center; gap:6px}
.card .own{margin-top:auto; font-family:var(--head); font-weight:800; color:var(--rc)}
.card details.bio{border-top:1.5px solid var(--line); padding-top:8px; margin-top:2px}
.card details.bio summary{cursor:pointer; font-family:var(--head); font-weight:800; font-size:1.1rem; color:var(--rc); list-style:none; padding:4px 0; min-height:32px}
.card details.bio summary::-webkit-details-marker{display:none}
.card details.bio summary::before{content:"+ "}
.card details.bio[open] summary::before{content:"− "}
.card details.bio h4{margin:10px 0 2px; font-family:var(--head); font-weight:800; font-size:1rem; color:var(--muted)}
.card details.bio p{margin:0; font-size:.95rem; line-height:1.5}
.card details.bio ul{margin:0; padding-left:1.1em; font-size:.95rem; line-height:1.45}
.card details.bio li{margin:2px 0}
.card.new{box-shadow:0 0 0 4px var(--board-ink)}
.secret-tile .num{background:var(--line); color:var(--muted)}
.secret-tile.open{border-color:var(--board-ink); border-width:2px}
.secret-tile.open .num{background:var(--board-ink); color:var(--board)}
.secret-board{text-align:center; padding:34px 18px 38px; background:linear-gradient(160deg,#10161D 0%,#2A1650 100%)}
.secret-board h2{margin:10px 0 0; font-family:var(--head); font-weight:800; font-size:clamp(2.2rem,10vw,3.4rem); line-height:1.05; color:var(--board-ink)}
.hearts{display:flex; justify-content:center; gap:10px; font-size:1.7rem; color:#FF5A7A; line-height:1}
@media (prefers-reduced-motion: no-preference){
  .hearts span{display:inline-block; animation:beat 1.4s ease-in-out infinite}
  .hearts span:nth-child(2n){animation-delay:.2s}
  .hearts span:nth-child(3n){animation-delay:.4s}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.95)}}
}
.statline{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin:6px 0}

@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth}
  .fact,.card.new{animation:rise .35s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .niko.hop .fig{animation:hop .45s ease-out}
  @keyframes hop{0%{transform:none}35%{transform:translateY(-10px)}70%{transform:none}85%{transform:translateY(-3px)}100%{transform:none}}
}
</style>
</head>
<body>
<header class="site-head">
  <div class="site-in">
    <a class="brand" href="#top">Путь в Ф1</a>
    <nav aria-label="Разделы"><a href="#game">Играть</a></nav>
  </div>
</header>

<section class="hero" id="top">
  <div class="site-in">
    <h1>Путь в Формулу 1</h1>
    <p class="lead">10 уровней и 100 вопросов — от самых простых до вопросов для настоящих знатоков. Проходи уровни, зарабатывай быстрые круги и собирай карточки легенд Формулы 1.</p>
    <a class="btn" href="#game">Играть</a>
  </div>
</section>

<section id="game">
  <div class="wrap">
    <header id="hud" class="hud"></header>
    <main id="app"></main>
  </div>
</section>

<footer class="site-foot">
  <div class="site-in">
    <p>Игра для тех, кто любит гонки. Прогресс сохраняется в этом браузере.</p>
  </div>
</footer>

<script>
(function(){
  "use strict";

  /* ---------- Данные: 10 уровней × 10 вопросов (правильный ответ всегда первый в списке, на экране варианты перемешиваются) ---------- */
  var LEVELS = [
    { name: "Новичок",
      intro: "«Начнём с азов, — говорит механик Лино. — Флаги, шины, очки. Без них в паддок не пускают».",
      niko: "Начнём спокойно. Я на связи, если что.",
      qs: [
        ["Сколько колёс у болида Формулы 1?", ["4", "3", "6"], "Четыре открытых колеса. Но в 1976 году Tyrrell выставила шестиколёсный болид P34 — и он даже выиграл Гран-при Швеции."],
        ["Какой флаг показывают на финише гонки?", ["Клетчатый", "Красный", "Синий"], "Клетчатым флагом встречают победителя. Красный останавливает гонку, а синий просит пропустить того, кто обгоняет на круг."],
        ["Где команды меняют шины во время гонки?", ["На пит-лейне", "В паддоке", "В гравийной ловушке"], "Лучшие пит-стопы длятся меньше двух секунд: над машиной одновременно работают около двадцати механиков."],
        ["Как называется первое место на стартовой решётке?", ["Поул-позиция", "Шикана", "Слипстрим"], "Поул завоёвывают в квалификации — самым быстрым кругом."],
        ["Из какой страны команда Ferrari?", ["Италия", "Германия", "Великобритания"], "База Ferrari находится в итальянском городке Маранелло."],
        ["Что означает красный флаг?", ["Гонку остановили", "Гонка окончена", "Пропусти соперника"], "Красный флаг показывают, когда ехать опасно: после серьёзной аварии или в сильный ливень."],
        ["Где проходит Гран-при Монако?", ["Прямо по улицам города", "На загородном автодроме", "На овале"], "Трасса проложена по улицам Монте-Карло, а Гран-при здесь проводят с 1929 года."],
        ["Откуда взялось слово «болид»?", ["Так называют очень яркий метеор", "Это фамилия изобретателя", "Это сокращение от «большой лидер»"], "Болид — яркий метеор, который проносится по небу. Гоночные машины так прозвали за скорость."],
        ["Сколько очков получает победитель Гран-при?", ["25", "10", "50"], "Такая система действует с 2010 года: 25 очков за победу, 18 за второе место и 15 за третье."],
        ["Как называется защитная дуга над головой пилота?", ["Halo", "Диффузор", "Монокок"], "Halo ввели в 2018 году. Она весит всего несколько килограммов, но выдерживает огромные нагрузки."]
      ]
    },
    { name: "Стажёр",
      intro: "«Уже лучше, — Лино довольно хмыкает. — Теперь про команды, цвета и трассы».",
      niko: "Цвета и трассы — основа. Запоминай, пригодится.",
      qs: [
        ["В какой цвет традиционно красят болиды Ferrari?", ["Красный", "Серебристый", "Зелёный"], "Это «rosso corsa» — гоночный красный, исторический цвет итальянских машин."],
        ["Как прозвали гоночные машины Mercedes?", ["Серебряные стрелы", "Красные дьяволы", "Чёрные пантеры"], "По легенде, в 1934 году с машины соскоблили белую краску, чтобы уложиться в лимит веса, — и под ней заблестел серебристый металл."],
        ["Кто делит с Михаэлем Шумахером рекорд в семь чемпионских титулов?", ["Льюис Хэмилтон", "Себастьян Феттель", "Фернандо Алонсо"], "Хэмилтон выиграл седьмой титул в 2020 году и сравнялся с Шумахером."],
        ["Что делала система DRS, появившаяся в 2011 году?", ["Открывала щель в заднем антикрыле для обгона", "Помогала тормозить", "Включала радио пилота"], "Открытое антикрыло снижало сопротивление воздуха и прибавляло скорости на прямой. В новых правилах 2026 года DRS убрали."],
        ["Какую трассу называют «Храмом скорости»?", ["Монцу", "Монако", "Сильверстоун"], "Монца в Италии — одна из самых быстрых трасс календаря: большую часть круга пилоты едут с педалью в пол."],
        ["Сколько болидов стартовало в каждой гонке сезона 2025?", ["20", "10", "30"], "Десять команд по две машины. В 2026 году пришла Cadillac, и машин стало 22."],
        ["Что означает синий флаг?", ["Пропусти более быстрого соперника", "Начался дождь", "Последний круг"], "Его показывают отстающим, когда их догоняют лидеры."],
        ["Какая компания поставляет шины для Ф1 с 2011 года?", ["Pirelli", "Michelin", "Bridgestone"], "У Pirelli шины разных цветов: красные — мягкие, жёлтые — средние, белые — жёсткие."],
        ["Что такое слипстрим?", ["Езда в воздушном «мешке» за соперником", "Тип дождевой шины", "Штраф за фальстарт"], "За машиной впереди воздух сопротивляется меньше, и можно разогнаться для обгона."],
        ["Какой номер имеет право взять действующий чемпион мира?", ["1", "0", "100"], "Ферстаппен ездил с номером 1 с 2022 по 2025 год, а в 2026-м его взял новый чемпион Ландо Норрис. Хэмилтон же всегда оставлял свой номер 44."]
      ]

  /* ---------- Хранилище ---------- */
  function load(){
    var d = { wallet: 0, passed: {}, best: {}, cards: [] };
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var o = JSON.parse(raw);
        if (o && typeof o === "object"){
          d.wallet = Math.max(0, parseInt(o.wallet, 10) || 0);
          d.passed = (o.passed && typeof o.passed === "object") ? o.passed : {};
          d.best = (o.best && typeof o.best === "object") ? o.best : {};
          d.cards = Array.isArray(o.cards) ? o.cards : [];
        }
      }
    } catch(e){}
    return d;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }

    return e;

    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }

  function runHud(){
    hud.innerHTML = "";
    var row = h("div", "hud-row");
    var left = h("span", "");
    left.append("Ур. " + (R.lvl + 1) + " · вопрос ", h("b", "", String(R.qi + 1)), "/10");
    var right = h("div", "hud-right");
    var passes = h("div", "passes");
    passes.setAttribute("role", "img");
    passes.setAttribute("aria-label", "Допусков осталось: " + R.lives);
    for (var k = 0; k < MAX_LIVES; k++) passes.append(h("span", "pass" + (k < R.lives ? "" : " off")));
    var hc = h("span", "hintcount", "💡 " + R.hints);
    hc.setAttribute("aria-label", "Подсказок осталось: " + R.hints);
    right.append(hc, passes, coin(P.wallet));
    row.append(left, right);
    var sectors = h("div", "sectors");
    for (var s = 0; s < 10; s++){
      var cls = R.marks[s] === true ? "ok" : (R.marks[s] === false ? "bad" : (s === R.qi ? "now" : ""));
      sectors.append(h("i", cls));
    }
    hud.append(row, sectors);
  }

  /* ---------- Главная ---------- */
  function renderHome(){
    menuHud("Паддок");
    app.innerHTML = "";
    var sec = h("section", "home");
    var board = h("div", "board hero2");
    board.append(h("h2", "", "Паддок ждёт тебя"), h("p", "sub", "10 уровней, 100 вопросов, 24 карточки"));
    sec.append(board);
    sec.append(nikoPanel(passedCount() === 0
      ? "Привет, я Тото, главный инженер. Буду на связи по радио на каждом уровне. Зарабатывай быстрые круги и собирай карточки гонщиков!"
      : "С возвращением! Пройдено уровней: " + passedCount() + " из 10. Прогреваем шины?", "happy"));

    var tiles = h("div", "tiles");
    var t1 = btn("tile", "", renderLevels);
    var n1 = h("span", "num", "▶");
    var c1 = h("span", "");
    c1.append(h("span", "tt", "Уровни"), h("span", "ts", "Пройдено " + passedCount() + " из 10"));
    t1.append(n1, c1);
    var t2 = btn("tile", "", function(){ renderShop(); });
    var n2 = h("span", "num");
    n2.innerHTML = lapIcon();
    n2.querySelector("svg").style.width = "60%";
    n2.querySelector("svg").style.height = "60%";
    var c2 = h("span", "");
    c2.append(h("span", "tt", "Магазин карточек"), h("span", "ts", "В коллекции " + P.cards.length + " из " + CARDS.length));
    t2.append(n2, c2);
    tiles.append(t1, t2);
    sec.append(tiles);

    var ul = h("ul", "rules");
    [
      "В каждом уровне 10 вопросов, и с каждым уровнем они сложнее.",
      "На уровень даётся три допуска. Ошибся трижды — уровень придётся пройти заново.",
      "На каждый уровень есть 2 подсказки Тото: подсказка убирает один неверный ответ.",
      "За каждый верный ответ — 2 быстрых круга, плюс бонус за первое прохождение уровня. Круги тратятся в магазине на карточки гонщиков."
    ].forEach(function(t){ ul.append(h("li", "", t)); });
    sec.append(ul);

    var reset = btn("linkish", "Сбросить прогресс");
    var armed = false;
    reset.addEventListener("click", function(){
      if (!armed){ armed = true; reset.textContent = "Точно сбросить всё? Нажми ещё раз"; return; }
      P = { wallet: 0, passed: {}, best: {}, cards: [] };
      save();
      renderHome();
    });
    sec.append(reset);
    app.append(sec);
    show();
  }

  /* ---------- Уровни ---------- */
  function renderLevels(){
    menuHud("Уровни");
    app.innerHTML = "";
    var sec = h("section", "levels");
    sec.append(btn("back", "← Паддок", renderHome));
    sec.append(h("h2", "place", "Выбери уровень"));
    sec.append(h("p", "scene", "Каждый следующий уровень открывается, когда пройден предыдущий."));
    var tiles = h("div", "tiles");
    LEVELS.forEach(function(L, i){
      var open = unlocked(i);
      var t = btn("tile" + (P.passed[i] ? " done" : ""), "", open ? function(){ startLevel(i); } : null);
      t.disabled = !open;
      var num = h("span", "num", open ? String(i + 1) : "🔒");
      var c = h("span", "");
      var status;
      if (P.passed[i]) status = "Пройден. Лучший результат: " + (P.best[i] || 0) + "/10";
      else if (open) status = "Награда за первое прохождение: до " + (20 + (i + 1) * 5 + 5) + " быстрых кругов";
      else status = "Закрыт: пройди уровень " + i;
      c.append(h("span", "tt", (i + 1) + ". " + L.name), h("span", "ts", status));
      t.append(num, c);
      tiles.append(t);
    });
    var open = secretOpen();
    var st = btn("tile secret-tile" + (open ? " open" : ""), "", open ? renderSecret : null);
    st.disabled = !open;
    var sn = h("span", "num", open ? "★" : "🔒");
    var sc = h("span", "");
    var have = CARDS.filter(function(c){ return P.cards.indexOf(c.id) !== -1; }).length;
    sc.append(h("span", "tt", open ? "Секретный уровень" : "???"),
              h("span", "ts", open ? "Открыт! Заходи." : "Откроется, когда пройдёшь все 10 уровней и соберёшь все карточки. Уровни: " + passedCount() + "/10, карточки: " + have + "/" + CARDS.length));
    st.append(sn, sc);
    tiles.append(st);
    sec.append(tiles);
    app.append(sec);
    show();
  }

  /* ---------- Секретный уровень ---------- */
  function renderSecret(){
    if (!secretOpen()){ renderLevels(); return; }
    menuHud("Секретный уровень");
    app.innerHTML = "";
    var sec = h("section", "secret");
    sec.append(btn("back", "← Уровни", renderLevels));
    var board = h("div", "board secret-board");
    var hearts = h("div", "hearts");
    hearts.setAttribute("aria-hidden", "true");
    for (var k = 0; k < 7; k++) hearts.append(h("span", "", "❤"));
    board.append(hearts, h("h2", "", "Эрик тебя очень любит"));
    sec.append(board);
    sec.append(nikoPanel("Ты прошёл всю игру и собрал все карточки. Это послание — специально для тебя.", "happy"));
    sec.append(btn("btn alt", "К уровням", renderLevels));
    app.append(sec);
    show();
  }

  /* ---------- Прохождение уровня ---------- */
  function startLevel(i){
    R = { lvl: i, qi: 0, lives: MAX_LIVES, hints: MAX_HINTS, hintHere: false, correct: 0, marks: [], done: false };
    renderQ();
  }

  function renderQ(){
    var L = LEVELS[R.lvl];
    var item = L.qs[R.qi];
    R.done = false;
    R.hintHere = false;
    runHud();
    app.innerHTML = "";
    var sec = h("section", "stage");
    if (R.qi === 0){
      sec.append(h("h2", "place", "Уровень " + (R.lvl + 1) + ". " + L.name), h("p", "scene", L.intro));
      sec.append(nikoPanel(L.niko, "normal"));
    } else {
      sec.append(h("h2", "place", "Вопрос " + (R.qi + 1)));
      sec.append(nikoPanel(pick(THINK), "normal"));
    }
    var board = h("div", "board");
    board.append(h("p", "q", item[0]));
    sec.append(board);

    var list = h("div", "opts");
    var order = shuffle(item[1].map(function(t, idx){ return { t: t, idx: idx }; }));
    order.forEach(function(o){
      var b = btn("opt", o.t);
      b.dataset.idx = String(o.idx);
      b.addEventListener("click", function(){ answer(o.idx, b, list); });
      list.append(b);
    });
    sec.append(list);
    var hb = btn("btn alt hintbtn", "", function(){ useHint(list, hb); });
    hb.id = "hintbtn";
    paintHint(hb);
    sec.append(hb);
    var fb = h("div", "feedback");
    fb.id = "fb";
    sec.append(fb);
    app.append(sec);
    show();
  }

  function answer(idx, button, list){
    if (R.done) return;
    R.done = true;
    var hbn = document.getElementById("hintbtn");
    if (hbn) hbn.disabled = true;
    var item = LEVELS[R.lvl].qs[R.qi];
    var ok = idx === 0;
    Array.prototype.forEach.call(list.children, function(b){
      b.disabled = true;
      if (b.classList.contains("gone")) return;
      if (b === button) b.classList.add(ok ? "ok" : "bad");
      else if (!ok && b.dataset.idx === "0") b.classList.add("right");
      else b.classList.add("dim");
    });
    R.marks[R.qi] = ok;
    if (ok){ R.correct++; setNiko(pick(CHEER), "happy"); }
    else { R.lives--; setNiko(R.lives > 0 ? pick(OOPS) : "Допуски закончились. Разберём телеметрию и попробуем снова.", "worried"); }
    runHud();

    var fb = document.getElementById("fb");
    var card = h("div", "fact" + (ok ? "" : " wrong"));
    card.append(h("h3", "", ok ? "Верно!" : "Правильный ответ: " + item[1][0]));
    card.append(h("p", "", item[2]));
    fb.append(card);

    var last = R.qi === 9;
    var label = R.lives <= 0 ? "Итоги" : (last ? "Финиш уровня" : "Дальше");
    fb.append(btn("btn", label, function(){
      if (R.lives <= 0) renderResult(false);
      else if (last) renderResult(true);
      else { R.qi++; renderQ(); }
    }));
    card.scrollIntoView({ block: "nearest" });
  }

  function paintHint(hb){
    hb.textContent = "💡 Подсказка Тото — убрать неверный ответ (осталось " + R.hints + " из " + MAX_HINTS + ")";
    hb.disabled = R.done || R.hints <= 0 || R.hintHere;
    if (R.hints <= 0) hb.textContent = "💡 Подсказки на этот уровень закончились";
    else if (R.hintHere) hb.textContent = "💡 Подсказка уже использована на этом вопросе";
  }
  function useHint(list, hb){
    if (R.done || R.hints <= 0 || R.hintHere) return;
    var wrong = Array.prototype.filter.call(list.children, function(b){ return b.dataset.idx !== "0" && !b.disabled; });
    if (!wrong.length) return;
    var b = pick(wrong);
    b.disabled = true;
    b.classList.add("gone");
    b.setAttribute("aria-label", b.textContent + " — убран подсказкой");
    R.hints--;
    R.hintHere = true;
    paintHint(hb);
    runHud();
    setNiko(R.hints > 0 ? "Убрал один лишний вариант. Выбирай из двух!" : "Убрал лишний вариант. Это была последняя подсказка на уровень — дальше сам!", "normal");
  }

  /* ---------- Итоги уровня ---------- */
  function renderResult(passed){
    var i = R.lvl;
    app.innerHTML = "";
    var sec = h("section", "result");
    if (passed){
      var first = !P.passed[i];
      var base = R.correct * 2;
      var bonus = first ? (i + 1) * 5 : 0;
      var perfect = R.correct === 10 ? 5 : 0;
      var total = base + bonus + perfect;
      P.wallet += total;
      P.passed[i] = true;
      P.best[i] = Math.max(P.best[i] || 0, R.correct);
      save();
      menuHud("Уровень пройден");

      var board = h("div", "board hero2");
      board.append(h("h2", "", i === 9 ? "Ты абсолютный чемпион!" : "Уровень " + (i + 1) + " пройден!"),
                   h("p", "sub", "Верных ответов: " + R.correct + " из 10"));
      sec.append(board);
      sec.append(nikoPanel(i === 9 ? "Лино снял перед тобой кепку, а я записал этот заезд в учебники!" : pick(["Отличная работа! Пора тратить круги?", "Чистый заезд. Следующий уровень ждёт.", "Команда гордится тобой!"]), "happy"));

      var rw = h("div", "reward");
      function line(label, n, cls){
        var l = h("div", "line" + (cls ? " " + cls : ""));
        l.append(h("span", "", label), coin("+" + n, label + ": "));
        rw.append(l);
      }
      line("За верные ответы (по 2)", base);
      if (bonus) line("Бонус за первое прохождение", bonus);
      if (perfect) line("Идеальный уровень", perfect);
      line("Всего", total, "total");
      sec.append(rw);

      if (secretOpen()) sec.append(btn("btn", "★ Секретный уровень", renderSecret));
      if (i < 9) sec.append(btn("btn", "Уровень " + (i + 2), function(){ startLevel(i + 1); }));
      sec.append(btn("btn alt", "В магазин", function(){ renderShop(); }));
      sec.append(btn("btn alt", "К уровням", renderLevels));
    } else {
      menuHud("Сход с дистанции");
      var b2 = h("div", "board hero2");
      b2.append(h("h2", "", "Допуски закончились"), h("p", "sub", "Верных ответов: " + R.correct + " из " + (R.qi + 1)));
      sec.append(b2);
      sec.append(nikoPanel("Даже лучшие команды сходят с дистанции. Перегруппируемся — и снова в бой.", "worried"));
      sec.append(btn("btn", "Ещё раз", function(){ startLevel(i); }));
      sec.append(btn("btn alt", "К уровням", renderLevels));
    }
    app.append(sec);
    show();
  }

  /* ---------- Магазин ---------- */
  function renderShop(newId){
    menuHud("Магазин");
    app.innerHTML = "";
    var sec = h("section", "shop");
    sec.append(btn("back", "← Паддок", renderHome));
    sec.append(h("h2", "place", "Магазин карточек"));
    var st = h("div", "statline");
    var w = h("span", ""); w.append("Твои быстрые круги: ", coin(P.wallet));
    st.append(w, h("span", "", "Коллекция: " + P.cards.length + " из " + CARDS.length));
    sec.append(st);

    var msg;
    if (newId){
      var bought = CARDS.filter(function(c){ return c.id === newId; })[0];
      msg = nikoPanel(secretOpen() ? "Это была последняя карточка! Открылся секретный уровень — ищи его в списке уровней." : "Отличный выбор! " + bought.name + " теперь в твоей коллекции.", "happy");
    } else if (allCards()){
      msg = nikoPanel(secretOpen() ? "Ты собрал все карточки! Загляни в уровни — там открылось кое-что секретное…" : "Ты собрал все карточки! Осталось пройти все уровни — и откроется секрет.", "happy");
    } else {
      msg = nikoPanel("Обычные стоят " + PRICE.common + ", редкие — " + PRICE.rare + ", а легенды — " + PRICE.legend + " быстрых кругов. Выбирай!", "normal");
    }
    sec.append(msg);

    var grid = h("div", "cards");
    var newEl = null;
    CARDS.forEach(function(c){
      var owned = P.cards.indexOf(c.id) !== -1;
      var el = h("article", "card " + c.r + (owned ? "" : " locked") + (c.id === newId ? " new" : ""));
      var strip = h("div", "strip");
      strip.append(h("span", "", RNAME[c.r]), h("span", "fl", c.flag));
      el.append(strip);
      var body = h("div", "body");
      var top = h("div", "top");
      var nr = NUM[c.id] || [null, ""];
      var av = h("span", "mono" + (nr[0] ? " num" + (nr[0].length > 1 ? " two" : "") : ""), nr[0] || initials(c.name));
      av.setAttribute("aria-label", nr[0] ? "Номер " + nr[0] : "Инициалы " + initials(c.name));
      top.append(av);
      var nm = h("div", "");
      nm.append(h("h3", "", c.name), h("span", "ts", c.country));
      top.append(nm);
      body.append(top);
      if (owned){
        var dl = document.createElement("dl");
        dl.append(h("dt", "", "Номер"), h("dd", "", (nr[0] ? "№" + nr[0] + " — " : "") + nr[1]));
        c.rows.forEach(function(r){ dl.append(h("dt", "", r[0]), h("dd", "", r[1])); });
        body.append(dl, h("p", "cf", c.fact));
        var B = BIO[c.id];
        if (B){
          var det = document.createElement("details");
          det.className = "bio";
          if (c.id === newId) det.open = true;
          det.append(h("summary", "", "Биография и достижения"));
          det.append(h("h4", "", "Биография"), h("p", "", B.bio));
          det.append(h("h4", "", "Достижения"));
          var ul = h("ul", "");
          B.ach.forEach(function(a){ ul.append(h("li", "", a)); });
          det.append(ul, h("h4", "", "История"), h("p", "", B.story));
          body.append(det);
        }
        body.append(h("span", "own", "✓ В коллекции"));
      } else {
        body.append(h("p", "note", "Биография, достижения и история откроются после покупки."));
        var price = PRICE[c.r];
        var b = h("button", "btn");
        b.type = "button";
        if (P.wallet >= price){
          b.append("Купить за ", coin(price));
          b.addEventListener("click", function(){ buy(c.id); });
        } else {
          b.disabled = true;
          b.append("Не хватает ", coin(price - P.wallet));
        }
        body.append(b);
      }
      el.append(body);
      grid.append(el);
      if (c.id === newId) newEl = el;
    });
    sec.append(grid);
    if (secretOpen()) sec.append(btn("btn", "★ Секретный уровень", renderSecret));
    app.append(sec);
    if (newEl){ firstRender = false; newEl.scrollIntoView({ block: "center" }); }
    else show();
  }

  function buy(id){
    var c = CARDS.filter(function(x){ return x.id === id; })[0];
    if (!c || P.cards.indexOf(id) !== -1) return;
    var price = PRICE[c.r];
    if (P.wallet < price) return;
    P.wallet -= price;
    P.cards.push(id);
    save();
    renderShop(id);
  }

  renderHome();
})();
</script>
</body>
</html>
